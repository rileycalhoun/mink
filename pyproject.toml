[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mink"
version = "0.1.0"
description = "Open-source lecture recording and transcription for classrooms"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Riley Calhoun" }]
keywords = ["transcription", "asr", "lecture", "education", "speech-to-text"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
capture = ["sounddevice>=0.4", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
mink = "mink.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mink"]

[tool.ruff]
target-version = "py310"
line-length = 100
